name: sync-shukatsu-mail

on:
  schedule:
    # UTC表記。日本時間の8:00〜23:45に15分ごと(JST = UTC+9)
    - cron: "*/15 23 * * *"   # JST 8時台
    - cron: "*/15 0-14 * * *" # JST 9時〜23時台
  workflow_dispatch: {}

# 前回の実行が終わる前に次が始まって二重登録しないようにする
concurrency:
  group: sync-shukatsu-mail
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m shukatsu_mail run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DS: ${{ secrets.NOTION_COMPANIES_DS }}
          NOTION_SCHEDULE_DS: ${{ secrets.NOTION_SCHEDULE_DS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
